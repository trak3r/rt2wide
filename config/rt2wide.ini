[rt2wide]
; 0 = switch the mod off and use Windows' own DirectDraw (same as not installed)
enabled=1

[display]
; wide    = the game runs at a screen shape matching your monitor, so more map is visible
; classic = the game's normal 1024x768 picture, scaled up with black bars at the sides
mode=wide
; Size the game draws at in wide mode before scaling to the monitor.
; width=0 picks it from the monitor shape (3440x1440 -> 1832x768). Bigger height = smaller UI.
width=0
height=768
; opengl (smooth scaling, default) or gdi (fallback if opengl misbehaves)
renderer=opengl
; aspect  = as large as fits, black bars where the shapes differ, no stretching
; integer = whole-number scale only (sharpest, smaller picture)
; stretch = fill the whole screen (distorted)
scaling=aspect
; linear = smooth, nearest = blocky/sharp
filter=linear
vsync=1

[debug]
log=1
trace_limit=25
; Developer test options; leave empty/0 for normal play.
dump_dir=
dump_every_ms=0
dump_max=20
autoquit_ms=0
script=
